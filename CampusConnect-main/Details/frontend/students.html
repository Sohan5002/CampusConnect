<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Students</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">CampusConnect</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html" class="active">Students</a>
        </div>
        <div class="nav-user">
            <span id="userInfo"></span>
            <button id="logoutBtn" class="btn btn-secondary">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Student Management</h1>
            <button id="addStudentBtn" class="btn btn-success" style="display: none;">Add New Student</button>
        </div>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="Search by name or roll number..." class="search-input">
            <select id="departmentFilter" class="filter-select">
                <option value="">All Departments</option>
            </select>
            <button id="searchBtn" class="btn btn-primary">Search</button>
        </div>

        <div id="message" class="message"></div>

        <div class="table-container">
            <table id="studentsTable" class="data-table">
                <thead>
                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Marks</th>
                        <th>Grade</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr>
                        <td colspan="7" class="loading">Loading students...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <button id="prevPageBtn" class="btn btn-secondary" disabled>Previous</button>
            <span id="pageInfo">Page 1 of 1</span>
            <button id="nextPageBtn" class="btn btn-secondary" disabled>Next</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/students.js"></script>
</body>
</html>
