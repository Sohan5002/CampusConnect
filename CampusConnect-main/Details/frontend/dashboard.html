<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">CampusConnect</div>
        <div class="nav-user">
            <span id="userInfo"></span>
            <button id="logoutBtn" class="btn btn-secondary">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Dashboard</h1>
            <div id="roleBadge" class="role-badge"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Students</h3>
                <p id="totalStudents" class="stat-value">-</p>
            </div>
            <div class="stat-card">
                <h3>Average Marks</h3>
                <p id="averageMarks" class="stat-value">-</p>
            </div>
            <div class="stat-card">
                <h3>Grade Distribution</h3>
                <div id="gradeDistribution" class="grade-distribution"></div>
            </div>
        </div>

        <div class="actions">
            <button id="viewStudentsBtn" class="btn btn-primary">View All Students</button>
            <button id="addStudentBtn" class="btn btn-success" style="display: none;">Add Student</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
