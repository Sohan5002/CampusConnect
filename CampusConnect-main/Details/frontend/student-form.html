<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Student Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">CampusConnect</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
        </div>
        <div class="nav-user">
            <span id="userInfo"></span>
            <button id="logoutBtn" class="btn btn-secondary">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 id="formTitle">Add Student</h1>
        </div>

        <form id="studentForm" class="student-form">
            <input type="hidden" id="studentId">

            <div class="form-row">
                <div class="form-group">
                    <label for="rollNo">Roll Number *</label>
                    <input type="number" id="rollNo" name="rollNo" required min="1" max="10000">
                </div>
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required maxlength="100">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="department">Department *</label>
                    <input type="text" id="department" name="department" required maxlength="100">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="marks">Marks (0-100)</label>
                    <input type="number" id="marks" name="marks" min="0" max="100" step="0.01">
                    <small style="color: var(--text-secondary); font-size: 0.875rem;">Grade will be calculated automatically</small>
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="contactNumber">Contact Number</label>
                    <input type="text" id="contactNumber" name="contactNumber" pattern="[0-9]{10}" maxlength="10">
                </div>
                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth</label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth">
                </div>
            </div>

            <div class="form-group">
                <label for="homeAddress">Home Address</label>
                <textarea id="homeAddress" name="homeAddress" rows="3" maxlength="255"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="program">Program</label>
                    <input type="text" id="program" name="program" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="enrollmentDate">Enrollment Date</label>
                    <input type="date" id="enrollmentDate" name="enrollmentDate">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="fatherName">Father's Name</label>
                    <input type="text" id="fatherName" name="fatherName" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="motherName">Mother's Name</label>
                    <input type="text" id="motherName" name="motherName" maxlength="100">
                </div>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Student</button>
                <a href="students.html" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/student-form.js"></script>
</body>
</html>
